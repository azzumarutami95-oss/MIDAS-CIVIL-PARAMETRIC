name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install Pillow==12.3.0
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Verify numeric and desktop policies
        run: npm test
      - name: Build standalone HTML
        run: python scripts/build_html.py
      - name: Build importable MCT and JSON examples
        run: node scripts/build_material_examples.cjs
      - name: Build Windows x64 installer
        run: npm run build:win
      - name: Install and test Windows app
        shell: pwsh
        run: |
          $exe = Get-Item dist/Civil-Hydration-NX-Setup-*-x64.exe
          $installation = Join-Path $env:RUNNER_TEMP 'CivilHydrationInstalled'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$installation" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $application = Join-Path $installation 'CivilHydrationNX.exe'
          if (!(Test-Path $application)) { throw 'Installed executable is missing' }
          node tests/desktop_smoke.cjs $application
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop app failed smoke tests' }
          $uninstaller = Get-ChildItem $installation -Filter '*Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller is missing' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          for ($i = 0; $i -lt 30 -and (Test-Path $application); $i++) { Start-Sleep -Milliseconds 300 }
          if (Test-Path $application) { throw 'Application executable remains after uninstall' }
      - name: Create checksum
        shell: pwsh
        run: |
          $files = @(Get-Item dist/Civil-Hydration-NX-Setup-*-x64.exe) + @(Get-Item downloads/CIVIL_HEAT_HYDRATION*.html) + @(Get-Item dist/PILAR_TIME_DEPENDENT_EXAMPLE.MCT,dist/PARAMETER_TIME_DEPENDENT_EXAMPLE.json)
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Civil-Hydration-NX-Windows-x64
          path: |
            dist/Civil-Hydration-NX-Setup-*-x64.exe
            dist/SHA256SUMS.txt
            downloads/CIVIL_HEAT_HYDRATION*.html
            dist/PILAR_TIME_DEPENDENT_EXAMPLE.MCT
            dist/PARAMETER_TIME_DEPENDENT_EXAMPLE.json
          if-no-files-found: error
      - name: Publish installer for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          Pembaruan material untuk aplikasi v1.1.1: creep/shrinkage ACI 209, CEB-FIP 1990, AASHTO 2006, dan USER; perkembangan kuat tekan ACI 209R-92, CEB-FIP 1990, serta tabel jobmix USER. Pilihan kuat tekan AASHTO memakai ACI 209R-92 sesuai konvensi WSDOT karena AASHTO tidak menetapkan model perkembangan kuat tekan sendiri.

          Parameter kode, tabel custom, modulus acuan creep, dan link independen untuk FC_OLD/FC_NEW tersimpan di JSON serta ikut dalam pratinjau, laporan TXT, dan MCT (TDM-FUNC, TDM-TYPE, TDM-ELAST, TDM-LINK). Default baru menghubungkan beton baru; JSON lama mempertahankan material konstan sampai fitur diaktifkan. SW Dead Load / LG_SW dengan faktor (0, 0, -1) tetap tersedia.

          Unduh installer untuk Windows 10/11 x64 atau HTML standalone untuk penggunaan offline. Rilis menyertakan SHA256SUMS.txt. Workflow memeriksa instalasi, pembukaan aplikasi, Save/Save As, ekspor, persistensi, dan uninstall pada Windows sebelum menerbitkan rilis.

          Aplikasi independen; parser/solver MIDAS belum diuji. Installer belum ditandatangani sertifikat penerbit.
          '@
          $notes | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME dist/Civil-Hydration-NX-Setup-*-x64.exe dist/SHA256SUMS.txt downloads/CIVIL_HEAT_HYDRATION_NX.html downloads/CIVIL_HEAT_HYDRATION.html dist/PILAR_TIME_DEPENDENT_EXAMPLE.MCT dist/PARAMETER_TIME_DEPENDENT_EXAMPLE.json --verify-tag --latest --title "Civil Hydration NX v$packageVersion — Time Dependent Material / Windows x64" --notes-file dist/RELEASE_NOTES.md
